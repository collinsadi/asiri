[package]
name = "asiri-sim"
description = "Asiri simulator: an in-process relay, headless clients and a malicious-relay proxy for end-to-end tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "asiri-sim"
path = "src/main.rs"

[features]
# Lets `asiri-sim buddy` join an onion relay (a real server) through embedded Tor.
tor = ["asiri-core/tor"]

[dependencies]
asiri-core.workspace = true
asiri-proto.workspace = true
asiri-relay.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-tungstenite.workspace = true
futures.workspace = true
tempfile.workspace = true
anyhow.workspace = true
getrandom.workspace = true
hex.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

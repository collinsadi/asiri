# cargo-deny configuration (architecture §14.3): licenses, advisories, sources, bans.
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates deep in the tree (proc-macro helpers) are tracked, not fatal; our direct
# dependencies must be maintained.
unmaintained = "workspace"
# Every ignored advisory says why it can't affect Asiri, and is revisited on each dependency
# update (docs/security.md, "Dependency advisories").
ignore = [
    { id = "RUSTSEC-2026-0331", reason = "libcrux-kem 0.0.9 (via openmls_libcrux_crypto 0.4.0, the latest release) panics decoding a short X-Wing public key. Only a group member can supply one, the engine contains panics (Store::tx, apply_payload) and key packages are length-checked before use. Remove when OpenMLS moves to hpke-rs-libcrux 0.8." },
    { id = "RUSTSEC-2026-0330", reason = "libcrux-kem 0.0.9 panics on a short encapsulation seed. The seed always comes from the local RNG at full length; never attacker-controlled." },
    { id = "RUSTSEC-2026-0329", reason = "libcrux-hmac-drbg 0.0.1 panics for output lengths divisible by 65536. OpenMLS requests at most a few dozen bytes per call." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing variability, reached through p256/p384 in openmls_basic_credential. Asiri signs with Ed25519 and encrypts with X-Wing only; no secret ever passes through crypto-bigint." },
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin attack) via Arti: Tor uses RSA only to verify relay identity signatures. Marvin needs private-key decryption or signing, which never happens." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # No telemetry, crash reporting or analytics SDKs (architecture §5.1, D9).
    { name = "sentry" },
    { name = "sentry-core" },
    { name = "opentelemetry" },
    { name = "bugsnag" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

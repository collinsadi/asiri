# The Mac app, on Xcode 16 (macOS 15) and on Xcode 27 (macOS 27): AsiriKit's tests with a
# snapshot of every screen (kept as `ci-snapshots-*`), and the full app — Rust core, Swift
# bridge, LiveKit calls — built by tools/release/build-app.sh exactly as scripts/ship.sh
# builds it on your Mac, then launched, and packed into the disk image a release ships in
# (with a picture of its install window in `ci-app-*`).
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  kit:
    name: AsiriKit on ${{ matrix.xcode }} (tests and snapshots)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, xcode: Xcode 16 }
          - { runner: xcode-27, xcode: Xcode 27 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode
        run: sw_vers && xcodebuild -version && swift --version
      - name: Build
        working-directory: apps/macos/Packages/AsiriKit
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee "$RUNNER_TEMP/kit-build.log"
      - name: Tests and snapshots
        working-directory: apps/macos/Packages/AsiriKit
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test --skip-build
      - name: Keep the snapshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-snapshots-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/snapshots
            ${{ runner.temp }}/kit-build.log
          if-no-files-found: ignore
          retention-days: 14

  app:
    name: Asiri.app on ${{ matrix.xcode }} (core, bridge, calls)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # A debug core keeps this one quick.
          - { runner: macos-15, xcode: Xcode 16, core: --debug --host-only }
          # The release core, exactly as scripts/ship.sh builds it.
          - { runner: xcode-27, xcode: Xcode 27, core: --host-only }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          sw_vers
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-${{ matrix.runner }}
      - name: Rust core → AsiriCoreFFI.xcframework and Swift bindings
        run: tools/release/build-xcframework.sh ${{ matrix.core }}
      - name: The bridge at run time, against a development relay
        run: |
          set -o pipefail
          cargo build -q -p asiri-sim --locked
          target/debug/asiri-sim relay --listen 127.0.0.1:8099 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 1 60); do grep -q "ASIRI1:" "$RUNNER_TEMP/relay.log" && break; sleep 1; done
          ASIRI_RELAY_CODE="$(grep -oE 'ASIRI1:[A-Za-z0-9_-]+' "$RUNNER_TEMP/relay.log" | head -1)"
          test -n "$ASIRI_RELAY_CODE" || { cat "$RUNNER_TEMP/relay.log"; exit 1; }
          export ASIRI_RELAY_CODE
          cd apps/macos/Packages/AsiriCoreBridge
          swift test 2>&1 | tee "$RUNNER_TEMP/bridge-tests.log"
      - name: Build Asiri.app (Release, the same script as scripts/ship.sh)
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen >/dev/null
          tools/release/build-app.sh --out "$RUNNER_TEMP/app"
      - name: The app launches, in demo mode and for real
        run: |
          app="$RUNNER_TEMP/app/Asiri.app"
          codesign --verify --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/Asiri"
          plutil -p "$app/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleIconName|NSCameraUsageDescription"
          "$app/Contents/MacOS/Asiri" --demo > "$RUNNER_TEMP/demo.log" 2>&1 &
          sleep 15
          kill -0 $! && echo "demo mode is up"
          swift scripts/ci/check-hidden-windows.swift $!   # never in screenshots or screen sharing
          screencapture -x "$RUNNER_TEMP/demo.png" || true
          kill $! || true
          ASIRI_LOG=info "$app/Contents/MacOS/Asiri" > "$RUNNER_TEMP/live.log" 2>&1 &
          sleep 15
          kill -0 $! && echo "the app with the real core is still running"
          tail -20 "$RUNNER_TEMP/live.log" || true
          screencapture -x "$RUNNER_TEMP/live.png" || true
          kill $! || true
      - name: The disk image opens on its install window (tools/release/make-dmg.sh)
        run: |
          tools/release/make-dmg.sh "$RUNNER_TEMP/app/Asiri.app" "$RUNNER_TEMP/Asiri.dmg"
          hdiutil attach -quiet -noautoopen "$RUNNER_TEMP/Asiri.dmg"
          volume="$(find /Volumes -maxdepth 1 -name 'Asiri *' | head -1)"
          open "$volume"
          sleep 6
          read -r id width height < <(swift scripts/ci/finder-window.swift)
          echo "Finder opened $volume in a ${width}×${height} window"
          screencapture -x -o -l "$id" "$RUNNER_TEMP/install-window.png" || true
          hdiutil detach -quiet "$volume"
      - name: Keep the build log and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-app-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/bridge-tests.log
            ${{ runner.temp }}/relay.log
            ${{ runner.temp }}/app/xcodebuild.log
            ${{ runner.temp }}/demo.log
            ${{ runner.temp }}/live.log
            ${{ runner.temp }}/demo.png
            ${{ runner.temp }}/live.png
            ${{ runner.temp }}/install-window.png
          if-no-files-found: ignore
          retention-days: 14

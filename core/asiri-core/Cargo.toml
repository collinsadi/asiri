[package]
name = "asiri-core"
description = "Asiri's security-critical core: identity, MLS, encrypted storage, networking, sync, media, calls, pairing and updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Embedded Tor (Arti) transport for onion relays (docs/adr/0003-direct-transport-for-development.md).
tor = ["dep:arti-client", "dep:tor-rtcompat"]

[dependencies]
asiri-proto.workspace = true
prost.workspace = true
openmls.workspace = true
openmls_traits.workspace = true
openmls_libcrux_crypto.workspace = true
openmls_sqlite_storage.workspace = true
openmls_basic_credential.workspace = true
tls_codec.workspace = true
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
hkdf.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
data-encoding.workspace = true
blurhash.workspace = true
thiserror.workspace = true
tracing.workspace = true
arti-client = { workspace = true, optional = true }
tor-rtcompat = { workspace = true, optional = true }

[dev-dependencies]
asiri-relay.workspace = true
tempfile.workspace = true
proptest.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
